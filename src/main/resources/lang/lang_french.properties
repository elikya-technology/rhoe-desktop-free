starter_sales=Pour vendre vos produits ou disposer de donn\u00E9es fiables sur les ventes que vous avez d\u00E9j\u00E0 effectu\u00E9es, utilisez l'interface Ventes. Pour commencer \u00E0 vendre vos produits, cliquez sur le bouton Nouvelle Vente.
starter_products=Pour g\u00E9rer vos produits, utilisez l'interface Produits. Rhoe vous permet d'ajouter des produits, de les \u00E9diter, de visualiser leurs mouvements g\u00E9n\u00E9raux et singuliers (ventes, stockages, retraits) et bien d'autres choses encore.
starter_charts=Rhoe utilise des tableaux pour repr\u00E9senter graphiquement les donn\u00E9es de votre entreprise. Il existe deux types de graphiques (sup\u00E9rieur et inf\u00E9rieur). Les graphiques sup\u00E9rieurs affichent les donn\u00E9es selon un crit\u00E8re g\u00E9n\u00E9ral, tandis que les graphiques inf\u00E9rieurs pr\u00E9sentent des informations d\u00E9taill\u00E9es et filtr\u00E9es sur les donn\u00E9es que vous voyez dans le graphique sup\u00E9rieur. En cliquant sur un graphique sup\u00E9rieur, les donn\u00E9es du graphique inf\u00E9rieur sont tri\u00E9es de mani\u00E8re \u00E0 n'afficher que les donn\u00E9es de la r\u00E9gion du graphique sup\u00E9rieur sur laquelle vous avez cliqu\u00E9.
starter_more=Afin de mieux g\u00E9rer votre magasin, Rhoe exige que vos produits soient affect\u00E9s \u00E0 des cat\u00E9gories et \u00E0 des fournisseurs. Pour ce faire, dans l'interface Produits, cliquez sur le bouton Plus. Les cat\u00E9gories sont des groupes de produits similaires (par exemple, ordinateurs, livres). Les fournisseurs sont des personnes ou des organisations qui vous fournissent les produits que vous vendez. Si les produits de votre entreprise ne sont pas class\u00E9s dans des cat\u00E9gories ni attribu\u00E9s \u00E0 des fournisseurs, il suffit d'ajouter des cat\u00E9gories par d\u00E9faut.
starter_options=Pour personnaliser Rhoe et l'adapter \u00E0 vos besoins, utilisez les options de l'interface. Il est important de garder \u00E0 l'esprit que les mots de passe d\u00E9finis sur la version gratuite ne peuvent pas être r\u00E9cup\u00E9r\u00E9s une fois oubli\u00E9s.
get_started_text=Merci d'avoir choisi Elikya Rhoe, le logiciel qui conduira votre entreprise vers le succ\u00E8s.
charts=Graphiques
